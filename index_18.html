<style>
/* ============================================================
   DIZAYN TOKENLARI
   ============================================================ */
:root{
  --ink:#0A0A0B;          /* asosiy qora fon */
  --ink-2:#0F0F12;        /* biroz ochroq */
  --panel:#151519;        /* kartochka foni */
  --panel-2:#1C1C22;
  --red:#2F6DFF;          /* asosiy urg'u — ko'k */
  --red-deep:#123FC7;
  --red-glow:rgba(47,109,255,.6);
  --bone:#F4F2EE;         /* issiq oq matn */
  --ash:#9A9AA2;          /* xira matn */
  --ash-dim:#6A6A72;
  --line:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --radius:22px;
  --radius-lg:30px;
  --maxw:1180px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --font-display:"Inter",system-ui,sans-serif;
  --font-sans:"Inter",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  background:var(--ink);
  color:var(--bone);
  line-height:1.55;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.no-scroll{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--red);color:#fff}



main,header.hero,footer{position:relative;z-index:1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;
  transition:background .3s var(--ease),border-color .3s,padding .3s;
  border-bottom:1px solid transparent;
}
.nav.scrolled{
  background:rgba(10,10,11,.92);
  border-bottom:1px solid var(--line);
  padding:12px 22px;
}
.logo{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-1px;display:flex;align-items:center;gap:2px}
.logo .slash{color:var(--red);transform:skewX(-12deg);display:inline-block}
.nav-center{display:flex;gap:30px;position:absolute;left:50%;transform:translateX(-50%)}
.nav-center a{font-size:13.5px;font-weight:600;color:var(--ash);letter-spacing:.2px;transition:color .25s;position:relative}
.nav-center a:hover{color:var(--bone)}
.nav-center a::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--red);transition:width .3s var(--ease)}
.nav-center a:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:14px}
.lang{display:flex;gap:2px;background:var(--glass);border:1px solid var(--line);border-radius:100px;padding:3px}
.lang button{font-size:12px;font-weight:700;padding:5px 10px;border-radius:100px;color:var(--ash);transition:.25s;letter-spacing:.5px}
.lang button.active{background:var(--red);color:#fff}
.burger{display:none;flex-direction:column;gap:5px;padding:8px}
.burger span{width:22px;height:2px;background:var(--bone);border-radius:2px;transition:.3s}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative;min-height:100svh;overflow:hidden}
.hero-glow{
  position:absolute;top:-6%;left:50%;transform:translateX(-50%);
  width:120vw;height:88vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 52% 64% at 52% 12%,var(--red-glow),transparent 66%);
  opacity:.65;animation:breathe 7s var(--ease) infinite;
}
@keyframes breathe{0%,100%{opacity:.5;transform:translateX(-50%) scale(1)}50%{opacity:.8;transform:translateX(-50%) scale(1.06)}}
/* CHAPDA: ism (rasm ortida, ko'rinib turadi) */
.hero-name{position:absolute;left:clamp(16px,4vw,58px);top:38%;z-index:3;max-width:42vw;
  transform:translate(calc(var(--p-x,0)*7px), calc(-50% + var(--p-y,0)*5px));
  font-family:var(--font-display);font-weight:800;font-size:clamp(34px,6.6vw,92px);
  line-height:.86;letter-spacing:-.03em;text-transform:uppercase;text-align:left;pointer-events:none;
  text-shadow:0 8px 40px rgba(0,0,0,.6);
}
.hero-name .ln{display:block;overflow:hidden}
.hero-name .ln span{display:block;transform:translateY(110%);transition:transform 1s var(--ease-out)}
/* MARKAZDA: rasm (ism ustida) */
.hero-photo{
  /* Shaffof PNG — foni umuman yo'q, to'g'ridan-to'g'ri ko'k ustida turadi. */
  position:absolute;left:50%;z-index:2;
  bottom:calc(5vh + 34px);
  height:min(calc(100svh - 92px - 5vh - 34px),900px);width:auto;
  transform:translate(calc(-50% + var(--p-x,0)*-10px), calc(var(--p-y,0)*-6px));
  object-fit:contain;object-position:bottom center;
  filter:contrast(1.02) saturate(1.02) drop-shadow(0 30px 70px rgba(0,0,0,.6));
}
.hero-photo.placeholder{
  width:min(44vw,380px);height:78vh;background:linear-gradient(160deg,var(--panel),var(--ink-2));
  border-radius:200px 200px 0 0;display:flex;align-items:center;justify-content:center;
  color:var(--ash-dim);font-size:13px;text-align:center;border:1px solid var(--line);border-bottom:none;
}
/* O'NGDA: kasb (rasm ustida) */
.hero-role{position:absolute;right:clamp(16px,4vw,58px);top:auto;bottom:15vh;z-index:4;
  transform:translate(calc(var(--p-x,0)*16px), calc(var(--p-y,0)*10px));
  font-family:var(--font-display);font-weight:800;font-size:clamp(30px,6.2vw,88px);
  line-height:.9;letter-spacing:-.02em;text-transform:uppercase;text-align:right;color:var(--bone);
  pointer-events:none;text-shadow:0 10px 46px rgba(0,0,0,.55);
}
.hero-bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 clamp(16px,4vw,66px) 5vh}
.hero-baseline{height:2px;background:linear-gradient(to right,transparent,var(--bone),transparent);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease-out) .5s}
.hero-sub{display:flex;justify-content:flex-end;gap:16px;margin-top:14px;flex-wrap:wrap}
.hero-sub p{font-size:13.5px;color:var(--ash);max-width:340px;opacity:0;transform:translateY(14px);transition:.8s var(--ease-out) .7s}
.scroll-cue{font-size:11px;letter-spacing:2px;color:var(--ash);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.scroll-cue::before{content:"";width:26px;height:1px;background:var(--ash-dim);display:inline-block}
/* MOBIL: ustma-ust joylashuv */
@media(max-width:820px){
  .hero-name{left:0;right:0;top:10vh;max-width:none;text-align:center;transform:none!important;font-size:clamp(32px,10vw,62px)}
  .hero-photo{left:50%;height:min(calc(100svh - 30vh),58vh);bottom:calc(5vh + 34px);transform:translateX(-50%)!important}
  .hero-photo.placeholder{width:min(70vw,320px);height:58vh}
  .hero-role{left:0;right:0;top:auto;bottom:9vh;text-align:center;transform:none!important;font-size:clamp(26px,9vw,56px);color:rgba(244,242,238,.94)}
}
/* hero reveal state */
.hero.in .hero-name .ln span{transform:translateY(0)}
.hero.in .hero-name .ln:nth-child(2) span{transition-delay:.12s}
.hero.in .hero-baseline{transform:scaleX(1)}
.hero.in .hero-sub p{opacity:1;transform:none}
/* KURSOR YOG'DUSI */
.cursor-glow{position:fixed;top:0;left:0;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;
  pointer-events:none;z-index:6;background:radial-gradient(circle,rgba(47,109,255,.20),transparent 62%);
  opacity:0;transition:opacity .4s;will-change:transform}

/* ============================================================
   SECTION SHELL
   ============================================================ */
section{position:relative;padding:clamp(70px,11vw,140px) 0;scroll-margin-top:90px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--red);margin-bottom:22px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--red)}
.h-sec{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,6vw,64px);line-height:1;letter-spacing:-.02em;text-transform:uppercase}
.reveal{opacity:0;transform:translate3d(46px,26px,0);
  transition:opacity 1s var(--ease-out),transform 1.05s var(--ease-out);will-change:transform,opacity}
.reveal.in{opacity:1;transform:translate3d(0,0,0);will-change:auto}
/* bu konteynerlarda shaffoflik bolalarga tegishli */
.folders.reveal,.services.reveal,.ai-grid.reveal{opacity:1;transform:none;transition:none}
.reveal.d1{transition-delay:.09s}.reveal.d2{transition-delay:.18s}.reveal.d3{transition-delay:.27s}
/* kartochkalar navbat bilan chiqadi */
.ai-grid.in .ai-card,.folders.in .folder{opacity:0;transform:translate3d(34px,18px,0);
  animation:slideIn .8s var(--ease-out) forwards}
.ai-grid.in .ai-card:nth-child(1),.folders.in .folder:nth-child(1){animation-delay:.04s}
.ai-grid.in .ai-card:nth-child(2),.folders.in .folder:nth-child(2){animation-delay:.11s}
.ai-grid.in .ai-card:nth-child(3),.folders.in .folder:nth-child(3){animation-delay:.18s}
.ai-grid.in .ai-card:nth-child(4),.folders.in .folder:nth-child(4){animation-delay:.25s}
.ai-grid.in .ai-card:nth-child(5),.folders.in .folder:nth-child(5){animation-delay:.32s}
.ai-grid.in .ai-card:nth-child(6),.folders.in .folder:nth-child(6){animation-delay:.39s}
@keyframes slideIn{to{opacity:1;transform:translate3d(0,0,0)}}
/* xizmat pill'lari ham navbat bilan */
.services.in .chip{opacity:0;animation:chipIn .6s var(--ease-out) forwards}
.services.in .chip:nth-child(2){animation-delay:.06s}
.services.in .chip:nth-child(3){animation-delay:.12s}
.services.in .chip:nth-child(4){animation-delay:.18s}
.services.in .chip:nth-child(5){animation-delay:.24s}
.services.in .chip:nth-child(6){animation-delay:.30s}
.services.in .chip:nth-child(7){animation-delay:.36s}
@keyframes chipIn{from{opacity:0;transform:translate3d(22px,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

/* --- 2) AMBIENT: sekin suzuvchi yog'du (faqat kompyuterda, transform-only) --- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
.ambient span{position:absolute;border-radius:50%;filter:blur(2px);will-change:transform;
  background:radial-gradient(closest-side,rgba(47,109,255,.13),transparent 100%)}
.ambient span:nth-child(1){width:520px;height:520px;left:-8%;top:12%;animation:drift1 26s ease-in-out infinite}
.ambient span:nth-child(2){width:420px;height:420px;right:-6%;top:52%;animation:drift2 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(70px,-50px,0)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-80px,60px,0)}}
@media(min-width:901px) and (pointer:fine){.ambient{display:block}}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:44px;align-items:start;margin-top:20px;margin-bottom:clamp(24px,5vw,70px)}
.about-photo{position:relative;border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:4/5;background:var(--panel);border:1px solid var(--line)}
.about-photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%;filter:contrast(1.04) saturate(.98) brightness(.98);transition:transform 1.1s var(--ease-out)}
.about-photo:hover img{transform:scale(1.045)}
.about-photo::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,10,11,.28) 0%,transparent 26%,transparent 52%,rgba(10,10,11,.86) 100%)}
.about-photo .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ash-dim);font-size:13px}
.about-cta{position:absolute;left:16px;right:16px;bottom:16px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 22px;border-radius:100px;background:rgba(20,20,26,.82);
  border:1px solid var(--glass-2);font-weight:700;font-size:14px;letter-spacing:.3px;transition:.35s var(--ease)}
.about-cta:hover{background:var(--red);border-color:var(--red)}
.about-cta .arrow{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--bone);display:grid;place-items:center;flex:none;transition:.35s}
.about-cta:hover .arrow{transform:rotate(45deg);border-color:#fff}
.about-title{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5.5vw,54px);line-height:1.02;letter-spacing:-.02em;margin:14px 0 26px}
.about-title b{color:var(--red)}
.about-body p{color:var(--ash);font-size:clamp(14.5px,1.45vw,16.5px);margin-bottom:14px;max-width:60ch}
.about-body p b{color:var(--bone);font-weight:700}
/* XIZMATLAR — pill tugmalar */
.services{margin-top:clamp(18px,2.6vw,30px);display:flex;flex-wrap:wrap;gap:9px 10px}
.services .chip{padding:10px 19px;border-radius:100px;font-size:clamp(12.5px,1.15vw,14.5px);font-weight:600;
  white-space:nowrap;transition:transform .35s var(--ease),box-shadow .35s var(--ease);cursor:default;
  animation:chipFloat 7s ease-in-out infinite;will-change:transform}
.services .chip.blue{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(47,109,255,.26)}
.services .chip.light{background:#fff;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.32)}
.services .chip:nth-child(2n){animation-duration:8.4s;animation-delay:-1.6s}
.services .chip:nth-child(3n){animation-duration:9.2s;animation-delay:-3.1s}
.services .chip:hover{transform:translateY(-4px) scale(1.05)}
.services .chip.blue:hover{box-shadow:0 18px 38px rgba(47,109,255,.45)}
.services .chip.light:hover{box-shadow:0 18px 38px rgba(255,255,255,.18)}
@keyframes chipFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.services .chip{animation:none}}

/* TOOLS — oqadigan dastur ikonkalari */
#tools{position:relative;overflow:hidden}
#tools .glow-blue{position:absolute;top:0;right:-6%;width:88vw;height:100%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 76% 52% at 74% 50%,rgba(47,109,255,.72),rgba(47,109,255,.22) 46%,transparent 70%);
  opacity:.95}
.tools-stage{position:relative;display:grid;grid-template-columns:1fr minmax(260px,400px);gap:30px;align-items:center;min-height:min(80vh,680px)}
.tools-copy{max-width:520px;z-index:2}
.tools-lead{color:var(--ash);font-size:clamp(15px,1.6vw,17.5px);margin-top:22px;max-width:44ch}
.soft-list{list-style:none;margin-top:clamp(26px,4vw,44px);display:flex;flex-direction:column;gap:clamp(12px,1.7vw,21px)}
.soft-item{display:flex;align-items:center;gap:14px;font-weight:700;letter-spacing:-.01em;
  font-size:clamp(15px,1.75vw,20px);color:var(--ash);opacity:.7;
  transform-origin:left center;transform:scale(1);
  transition:transform .5s var(--ease),color .5s var(--ease),opacity .5s var(--ease);will-change:transform}
.soft-ico{display:none}
.soft-item .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;
  transition:box-shadow .5s var(--ease),transform .5s var(--ease)}
.soft-item.on{color:#fff;opacity:1;transform:scale(1.42)}
.soft-item.on .dot{transform:scale(.76);box-shadow:0 0 0 4px rgba(47,109,255,.2),0 0 18px var(--red)}
.tools-flow{position:relative;height:min(80vh,680px);overflow:hidden;z-index:2;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 16%,#000 84%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 16%,#000 84%,transparent)}
.flow-track{position:absolute;inset:0}
.icon-tile{position:absolute;top:0;right:0;width:118px;height:118px;border-radius:27px;display:grid;place-items:center;overflow:hidden;
  transform-origin:center right;box-shadow:0 18px 42px rgba(0,0,0,.55);transition:box-shadow .35s;will-change:transform,opacity}
.icon-tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.icon-tile img{width:100%;height:100%;object-fit:cover}
.icon-tile .mono{font-family:var(--font-display);font-weight:800;font-size:42px;letter-spacing:-1.5px;line-height:1}
.icon-tile.active{box-shadow:0 26px 64px rgba(47,109,255,.45)}
@media(max-width:820px){
  .tools-stage{grid-template-columns:1fr;gap:6px;min-height:auto}
  .tools-flow{height:52vh;margin-top:10px}
  #tools .glow-blue{right:-34%;width:130vw;opacity:.5;
    background:radial-gradient(closest-side,rgba(47,109,255,.5),transparent 100%)}
  .icon-tile{width:88px;height:88px;border-radius:22px}
  .icon-tile .mono{font-size:30px}
}
@media(prefers-reduced-motion:reduce){
  .icon-tile{opacity:1!important}
  .soft-item{opacity:1;transform:none}
  .soft-item.on{transform:none;color:#fff}
}

/* AI */
.ai-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:34px;margin-bottom:clamp(30px,6vw,80px)}
.ai-card{aspect-ratio:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;overflow:hidden;
  transition:transform .4s var(--ease),border-color .4s,background .4s}
.ai-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(47,109,255,.18),transparent 70%);opacity:0;transition:.4s}
.ai-card:hover{transform:translateY(-9px);border-color:rgba(47,109,255,.55);background:var(--panel-2);box-shadow:0 20px 44px rgba(47,109,255,.18)}
.ai-card:hover::before{opacity:1}
.ai-card .ico{width:62px;height:62px;display:grid;place-items:center;font-size:40px;
  animation:aiFloat 5.4s ease-in-out infinite;will-change:transform}
.ai-card:nth-child(2n) .ico{animation-duration:6.4s;animation-delay:-1.5s}
.ai-card:nth-child(3n) .ico{animation-duration:7.2s;animation-delay:-3s}
@keyframes aiFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-7px,0)}}
/* ichki qatlam — hover'da kattalashadi (float bilan urishmaydi) */
.ai-mark{display:grid;place-items:center;width:100%;height:100%;
  transition:transform .5s var(--ease);will-change:transform}
.ai-mark img{width:100%;height:100%;object-fit:contain;display:block}
.ai-card .ico.tile .ai-mark img{object-fit:cover;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.ai-card:hover .ai-mark{transform:scale(1.16) rotate(-5deg)}
.ai-card > span{font-weight:600;font-size:14px;color:var(--bone);
  transition:transform .45s var(--ease),color .45s var(--ease)}
.ai-card:hover > span{transform:translateY(2px);color:#fff}
/* yorug'lik yugurib o'tadi */
.ai-card::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
  transform:translate3d(0,0,0) skewX(-18deg);transition:transform .75s var(--ease);will-change:transform}
.ai-card:hover::after{transform:translate3d(420%,0,0) skewX(-18deg)}

/* PROJECTS */
.proj-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-top:clamp(20px,5vw,56px)}
.proj-head .hint{color:var(--ash);font-size:14px;padding-bottom:6px}
.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:44px;margin-bottom:clamp(34px,5vw,64px)}
.folder{position:relative;cursor:pointer;perspective:1100px}
.folder-inner{position:relative;aspect-ratio:1.18/1;border-radius:20px;transition:transform .5s var(--ease);transform-style:preserve-3d;will-change:transform}
.folder:hover .folder-inner{transform:translateY(-10px)}
/* back plate */
.folder-back{position:absolute;inset:8% 4% 0 4%;background:linear-gradient(160deg,#0a1c4d,#12307e);border-radius:14px 26px 18px 18px;box-shadow:inset 0 2px 10px rgba(0,0,0,.35)}
.folder-back::before{content:"";position:absolute;top:-9px;left:12%;width:40%;height:16px;background:linear-gradient(160deg,#0a1c4d,#12307e);border-radius:10px 12px 0 0}
/* content sheet peeking */
.folder-sheet{position:absolute;inset:20% 12% 14% 12%;background:var(--ink-2);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.06);
  transition:transform .5s var(--ease),inset .5s var(--ease);display:grid;place-items:center}
.folder-sheet img{width:100%;height:100%;object-fit:cover}
.folder-sheet .mono{font-family:var(--font-display);font-weight:800;font-size:clamp(24px,3vw,40px);color:rgba(255,255,255,.16)}
.folder:hover .folder-sheet{transform:translateY(-14%)}
/* front lid (glass) */
.folder-lid{position:absolute;inset:8% 4% 0 4%;border-radius:14px 26px 18px 18px;
  background:linear-gradient(160deg,rgba(47,109,255,.95),rgba(18,63,199,.95));
  box-shadow:0 20px 40px rgba(20,63,199,.32),inset 0 1px 0 rgba(255,255,255,.25);
  transform-origin:bottom center;transition:transform .55s var(--ease),opacity .5s;
  display:flex;align-items:flex-end;padding:16px 18px}
.folder-lid::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 45%);opacity:.6}
.folder-lid .lidlogo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.9);display:grid;place-items:center;overflow:hidden;position:relative;z-index:2}
.folder-lid .lidlogo img{width:100%;height:100%;object-fit:contain;padding:6px}
.folder-lid .lidlogo span{font-family:var(--font-display);font-weight:800;color:var(--red);font-size:18px}
.folder:hover .folder-lid{transform:rotateX(-46deg) translateY(-2%)}
.folder-cap{margin-top:16px;text-align:center;min-height:46px}
.folder-cap h3{font-size:16px;font-weight:700;line-height:1.2}
.folder-cap p{font-size:12.5px;color:var(--ash);margin-top:3px}
.folder-count{position:absolute;top:-6px;right:2px;z-index:5;background:var(--ink);border:1px solid var(--line);color:var(--ash);
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:100px}

/* ============================================================
   PROJECT DETAIL (overlay page)
   ============================================================ */
.detail{position:fixed;inset:0;z-index:200;background:var(--ink);overflow-y:auto;opacity:0;visibility:hidden;

.detail.open{opacity:1;visibility:visible;transform:none}
.detail-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;

.back-btn{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.back-btn .c{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:.3s}

  /* ---------- SICHQONCHA EFFEKTLARI (yog'du + parallax) ---------- */
  function initPointerFX() {
    const fine = mq("(pointer:fine)").matches;
    const reduce = mq("(prefers-reduced-motion:reduce)").matches;
    if (!fine || reduce) return;
    const glow = document.createElement("div"); glow.className = "cursor-glow";
    document.body.appendChild(glow);
    const hero = $("#top");
    let mx = window.innerWidth / 2, my = window.innerHeight / 2, gx = mx, gy = my;
    let tpx = 0, tpy = 0, px = 0, py = 0, running = false, lastMove = 0;
    window.addEventListener("mousemove", (e) => {
      mx = e.clientX; my = e.clientY;
      tpx = e.clientX / window.innerWidth - 0.5;
      tpy = e.clientY / window.innerHeight - 0.5;
      lastMove = performance.now();
      if (!running) { running = true; glow.style.opacity = "1"; requestAnimationFrame(loop); }
    }, { passive: true });
    function loop() {
      gx += (mx - gx) * 0.15; gy += (my - gy) * 0.15;
      glow.style.transform = `translate(${gx.toFixed(1)}px,${gy.toFixed(1)}px)`;
      px += (tpx - px) * 0.08; py += (tpy - py) * 0.08;
      if (hero) { hero.style.setProperty("--p-x", px.toFixed(4)); hero.style.setProperty("--p-y", py.toFixed(4)); }
      const idle = performance.now() - lastMove > 260;
      const settled = Math.abs(mx - gx) < 0.5 && Math.abs(my - gy) < 0.5 && Math.abs(tpx - px) < 0.001 && Math.abs(tpy - py) < 0.001;
      if (idle && settled) { running = false; return; } // bekorchi -> to'xtaydi
      requestAnimationFrame(loop);
    }
  }

  /* ---------- TOOLS: yoy shaklida oqadigan ikonkalar ---------- */
  let flowRAF = null, flowResizeHandler = null, flowTimer = null;
  function buildFlow() {
    const track = $("#flowTrack"); if (!track) return;
    track.innerHTML = "";
    CONFIG.tools.list.forEach((t) => {
      const d = el("div", "icon-tile");
      d.dataset.name = t.name;
      if (t.icon) { const im = new Image(); im.src = t.icon; im.alt = t.name; d.appendChild(im); }

      }

    });
    // barcha dasturlar ro'yxati
    const list = $("#softList");
    if (list) {
      list.innerHTML = "";
      CONFIG.tools.list.forEach((t) => {
        const li = el("li", "soft-item");
        li.dataset.name = t.name;

        list.appendChild(li);
      });
      const first = list.firstElementChild;

    startFlow();
  }
  function startFlow() {
    cancelAnimationFrame(flowRAF);
    const flow = $("#toolsFlow"), track = $("#flowTrack"), list = $("#softList");
    if (!flow || !track) return;
    const tiles = [...track.children];
    if (!tiles.length) return;

    const reduce = mq("(prefers-reduced-motion:reduce)").matches;
    const tileW = tiles[0].offsetWidth || 118;
    let H = flow.clientHeight || 600;
    const n = tiles.length;
    const spacing = tileW + 40;      // markazlar orasidagi masofa
    const totalH = n * spacing;

    const setOn = (nm) => {
      if (!list) return;
      [...list.children].forEach((li) => li.classList.toggle("on", li.dataset.name === nm));
    };
    if (flowTimer) { clearInterval(flowTimer); flowTimer = null; }

    // yoy: telefonda ixchamroq, kompyuterda kengroq
    const narrow = () => window.innerWidth <= 640;
    let depth = narrow() ? tileW * 0.3 : tileW * 0.8;
    // telefonda soha ekran chetidan tashqariga chiqadi — ko'rinadigan qismiga markazlaymiz
    const calcBase = () => {
      if (!narrow()) return 6;
      const r = flow.getBoundingClientRect();
      const off = Math.max(0, r.right - window.innerWidth);
      const visible = Math.max(tileW, r.width - off);
      return off + Math.max(4, (visible - tileW) / 2 - depth / 2);
    };
    let baseRight = calcBase();

    function place(tile, y) {
      const centerY = H / 2;
      const dist = (y - centerY) / (H / 2);            // -1..1
      const arc = Math.min(dist * dist, 1);             // 0 markaz, 1 chet
      const scale = 1.06 - Math.min(Math.abs(y - centerY) / (H * 0.5), 1) * 0.5;
      const rightPx = baseRight + (1 - arc) * depth;
      const opacity = 1 - arc * 0.65;
      // faqat transform — layout qayta hisoblanmaydi (tez ishlaydi)
      tile.style.transform = "translate(" + (-rightPx).toFixed(1) + "px," + (y - tileW / 2).toFixed(1) + "px) scale(" + scale.toFixed(3) + ")";
      tile.style.opacity = opacity.toFixed(3);
    }

    if (reduce) {
      const mid = Math.round((n - 1) / 2);
      tiles.forEach((t, i) => place(t, H / 2 + (i - (n - 1) / 2) * spacing));
      if (tiles[mid]) tiles[mid].classList.add("active");
      if (list && CONFIG.tools.list[mid]) {
        [...list.children].forEach((li) => li.classList.toggle("on", li.dataset.name === CONFIG.tools.list[mid].name));
      }
      return;
    }

    let lastName = "";
    const STEP_MS = 460;    // tez tushish
    const HOLD_MS = 1000;   // 1 sekund turadi
    // ro'yxat teskari joylashadi: pastga tushganda tartib to'g'ri ketadi
    const posOf = (i) => (n - 1 - i) * spacing;
    // boshlanishida birinchi dastur aynan markazda tursin
    const startOffset = totalH / 2 - posOf(0);
    let offset = startOffset, from = startOffset, to = startOffset;
    let phase = "hold", t0 = (window.performance ? performance.now() : Date.now());

    const remeasure = () => {
      H = flow.clientHeight || H;
      depth = narrow() ? tileW * 0.3 : tileW * 0.8;
      baseRight = calcBase();
    };
    if (flowResizeHandler) window.removeEventListener("resize", flowResizeHandler);
    flowResizeHandler = remeasure;
    window.addEventListener("resize", flowResizeHandler, { passive: true });

    function frame(now) {
      now = now || (window.performance ? performance.now() : Date.now());
      if (phase === "hold") {
        if (now - t0 >= HOLD_MS) { from = offset; to = offset + spacing; t0 = now; phase = "move"; }
      } else {
        const p = Math.min(1, (now - t0) / STEP_MS);
        const e = 1 - Math.pow(1 - p, 3);          // tez boshlanib, yumshoq to'xtaydi
        offset = from + (to - from) * e;
        if (p >= 1) { offset = to; phase = "hold"; t0 = now; }
      }
      const centerY = H / 2;
      let best = null, bestD = 1e9;
      tiles.forEach((tile, i) => {
        let y = ((posOf(i) + offset) % totalH + totalH) % totalH;
        y = y - (totalH - H) / 2;      // bandni flow ichida markazlash
        place(tile, y);
        const d = Math.abs(y - centerY);
        if (d < bestD) { bestD = d; best = tile; }
        tile.classList.remove("active");
      });
      if (best) {
        best.classList.add("active");
        const nm = best.dataset.name;
        if (nm !== lastName) { lastName = nm; setOn(nm); }
      }
      flowRAF = requestAnimationFrame(frame);
    }
    flowRAF = requestAnimationFrame(frame);
  }

  /* ---------- SILLIQ SCROLL (desktop) ---------- */
  function initSmoothScroll() {
    const fine = mq("(pointer:fine)").matches;
    const reduce = mq("(prefers-reduced-motion:reduce)").matches;
    if (!fine || reduce || window.innerWidth < 900) return; // mobil = tabiiy silliq
    let target = window.scrollY, current = target, active = false, raf = null;
    const ease = 0.13;
    const clamp = (v) => Math.max(0, Math.min(v, document.documentElement.scrollHeight - window.innerHeight));
    function loop() {
      current += (target - current) * ease;
      if (Math.abs(target - current) < 0.4) { current = target; window.scrollTo(0, current); active = false; return; }
      window.scrollTo(0, current);
      raf = requestAnimationFrame(loop);
    }
    window.addEventListener("wheel", (e) => {
      if (document.body.classList.contains("no-scroll")) return;
      e.preventDefault();
      target = clamp(target + e.deltaY);
      if (!active) { active = true; current = window.scrollY; raf = requestAnimationFrame(loop); }
    }, { passive: false });
    window.addEventListener("scroll", () => { if (!active) target = window.scrollY; }, { passive: true });
    document.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener("click", () => {
      cancelAnimationFrame(raf); active = false; setTimeout(() => { target = window.scrollY; }, 700);
    }));
  }

    bPrev.innerHTML = `<div class="lbl">← ${L(CONFIG.ui.prev)}</div><div class="nm">${L(items[prev].title)}</div>`;
    bPrev.addEventListener("click", () => openDetail(prev));
    const bNext = document.createElement("button"); bNext.className = "next";
    bNext.innerHTML = `<div class="lbl">${L(CONFIG.ui.next)} →</div><div class="nm">${L(items[next].title)}</div>`;
    bNext.addEventListener("click", () => openDetail(next));
    nav.append(bPrev, bNext);

    const d = $("#detail");
    d.scrollTop = 0;
    d.classList.add("open");
    document.body.classList.add("no-scroll");
    location.hash = "p/" + p.id;
  }
  function closeDetail() {
    $("#detail").classList.remove("open");
    document.body.classList.remove("no-scroll");
    if (location.hash.startsWith("#p/")) history.replaceState(null, "", location.pathname + "#projects");
  }

  /* ---------- LIGHTBOX ---------- */
  let lbImgs = [], lbIdx = 0;
  function openLightbox(imgs, idx) { lbImgs = imgs; lbIdx = idx; showLb(); $("#lightbox").classList.add("open"); }
  function showLb() { $("#lbImg").src = lbImgs[lbIdx]; }
  function lbMove(d) { lbIdx = (lbIdx + d + lbImgs.length) % lbImgs.length; showLb(); }
  function closeLb() { $("#lightbox").classList.remove("open"); }

  /* ---------- MOBILE MENU ---------- */
  function openMenu() { $("#mobileMenu").classList.add("open"); document.body.classList.add("no-scroll"); }
  function closeMenu() { $("#mobileMenu").classList.remove("open"); document.body.classList.remove("no-scroll"); }

  /* ---------- SCROLL REVEAL ---------- */
  function initReveal() {
    const nodes = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) { nodes.forEach((n) => n.classList.add("in")); return; }
    const io = new IntersectionObserver((ents) => {
      ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.14 });
    nodes.forEach((n) => io.observe(n));
  }

  /* ---------- LANG ---------- */
  function setLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll("#lang button").forEach((b) => b.classList.toggle("active", b.dataset.lang === l));
    renderStatic();
    // if a detail is open, re-render it in new language
    if ($("#detail").classList.contains("open")) openDetail(currentProj);
  }

  /* ---------- INIT ---------- */
  function init() {
    buildHeroName();
    renderStatic();
    initReveal();
    initPointerFX();

    // dastur animatsiyasini faqat ko'rinib turganda ishlatamiz (tejamkor)
    const toolsSec = $("#tools");
    let toolsVisible = false;
    if (toolsSec && "IntersectionObserver" in window) {
      const fo = new IntersectionObserver((ents) => {
        ents.forEach((e) => {
          toolsVisible = e.isIntersecting;
          if (e.isIntersecting) { if (!flowRAF) startFlow(); }
          else { cancelAnimationFrame(flowRAF); flowRAF = null; }
        });
      }, { threshold: 0 });
      fo.observe(toolsSec);
    }
    let wasNarrow = window.innerWidth <= 640;
    window.addEventListener("resize", () => {
      const now = window.innerWidth <= 640;
      if (now !== wasNarrow) { wasNarrow = now; cancelAnimationFrame(flowRAF); flowRAF = null; startFlow(); }
    }, { passive: true });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { cancelAnimationFrame(flowRAF); flowRAF = null; }
      else if (toolsVisible && !flowRAF) startFlow();
    });

    // hero entrance
    requestAnimationFrame(() => requestAnimationFrame(() => $("#top").classList.add("in")));

    // nav scroll state
    const nav = $("#nav");
    const onScroll = () => nav.classList.toggle("scrolled", window.scrollY > 40);
    onScroll(); window.addEventListener("scroll", onScroll, { passive: true });

    // lang buttons
    document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));

    // menu
    $("#burger").addEventListener("click", openMenu);
    $("#mmClose").addEventListener("click", closeMenu);

    // detail
    $("#backBtn").addEventListener("click", closeDetail);

    // lightbox
    $("#lbClose").addEventListener("click", closeLb);
    $("#lbPrev").addEventListener("click", () => lbMove(-1));
    $("#lbNext").addEventListener("click", () => lbMove(1));
    $("#lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLb(); });

    // esc + arrows
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { if ($("#lightbox").classList.contains("open")) closeLb(); else if ($("#detail").classList.contains("open")) closeDetail(); else closeMenu(); }
      if ($("#lightbox").classList.contains("open")) { if (e.key === "ArrowRight") lbMove(1); if (e.key === "ArrowLeft") lbMove(-1); }
    });

    // contact send (no backend — opens mail / telegram)
    $("#contactSend").addEventListener("click", () => {
      const v = $("#contactMail").value.trim();
      const to = CONFIG.contact.email && CONFIG.contact.email !== "mailto:" ? CONFIG.contact.email : null;
      if (to) window.location.href = to + "?subject=Portfolio&body=" + encodeURIComponent(v);
      else window.open(CONFIG.contact.telegram, "_blank");
    });

    // menyu bosilganda — ishonchli silliq o'tish
    document.addEventListener("click", (e) => {
      const a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute("href").slice(1);
      if (!id) return;
      const sec = document.getElementById(id);
      if (!sec) return;
      e.preventDefault();
      closeMenu();
      const y = sec.getBoundingClientRect().top + window.scrollY - 80;
      try { window.scrollTo({ top: y, behavior: "smooth" }); }
      catch (_) { window.scrollTo(0, y); }
    });

    // open by hash (shareable project links)
    if (location.hash.startsWith("#p/")) {
      const id = location.hash.slice(3);
      const idx = CONFIG.projects.items.findIndex((p) => p.id === id);
      if (idx >= 0) setTimeout(() => openDetail(idx), 300);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
